name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: brainbuster_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      RUBYOPT: ""
      PGHOST: localhost
      PGUSER: root
      PGPASSWORD: root
      PGPORT: "5432"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.1'
          bundler-cache: true

      - name: Run Rubocop (style checks)
        run: bundle exec rubocop

      - name: Run Brakeman (security scan)
        run: bundle exec brakeman -q

      - name: Run Bundler Audit (dependency vulnerabilities)
        run: |
          bundle exec bundler-audit update
          bundle exec bundler-audit check

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Run test suite
        run: bin/rails test
