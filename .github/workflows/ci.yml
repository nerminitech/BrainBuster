# CI-Pipeline für BrainBuster: führt Checks & Tests bei jedem Push/PR aus.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Läuft auf einer frischen Ubuntu-VM in GitHub Actions.
    runs-on: ubuntu-latest
    services:
      postgres:
        # Postgres-Container als Test-Datenbank.
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: brainbuster_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Standard-ENV für Rails-Tests und DB-Verbindung.
      RAILS_ENV: test
      RUBYOPT: ""
      PGHOST: localhost
      PGUSER: root
      PGPASSWORD: root
      PGPORT: "5432"
    steps:
      # 1) Repository-Code klonen.
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2) Ruby 3.2.1 installieren + Gems aus dem Cache/bundle install.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.1'
          bundler-cache: true

      # 3) Stil- und Lint-Prüfung.
      - name: Run Rubocop (style checks)
        run: bundle exec rubocop

      # 4) Sicherheitsanalyse für Rails.
      - name: Run Brakeman (security scan)
        run: bundle exec brakeman -q

      # 5) Gem-Abhängigkeiten auf bekannte CVEs prüfen.
      - name: Run Bundler Audit (dependency vulnerabilities)
        run: |
          bundle exec bundler-audit update
          bundle exec bundler-audit check

      # 6) Test-Datenbank aufsetzen.
      - name: Prepare database
        run: bin/rails db:test:prepare

      # 7) Integrations-Tests ausführen.
      - name: Run integration tests
        run: bin/rails test:integration

      # 8) Gesamte Testsuite laufen lassen.
      - name: Run test suite
        run: bin/rails test
