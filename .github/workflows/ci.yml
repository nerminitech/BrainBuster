name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      RUBYOPT: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.1'
          bundler-cache: true

      - name: Run Rubocop (style checks)
        run: bundle exec rubocop

      - name: Run Brakeman (security scan)
        run: bundle exec brakeman -q

      - name: Run Bundler Audit (dependency vulnerabilities)
        run: |
          bundle exec bundler-audit update
          bundle exec bundler-audit check

      - name: Prepare database
        run: |
          RAILS_ENV=test DISABLE_DATABASE_ENVIRONMENT_CHECK=1 bin/rails db:test:prepare

      - name: Run test suite
        run: RAILS_ENV=test bin/rails test
